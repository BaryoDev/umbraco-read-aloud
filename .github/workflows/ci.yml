name: CI

on:
  # feat/** is included so a branch gets a signal before a pull request exists. The concurrency
  # group below collapses the push run and the pull request run for the same branch into one.
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  # head_ref is set for pull requests and ref_name for pushes, and both are the branch name, so a
  # push to a branch that already has an open pull request lands in the same group as that pull
  # request's run and one of the two is cancelled rather than both running the whole matrix.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Runs first and on every push. A committed credential is not something to discover later:
  # anything that reaches a public repo has to be treated as disclosed, not merely removed.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan history, not just the tip

      # The gitleaks binary is MIT licensed and free. Their GitHub Action is not: it refuses to
      # run for an organization without a paid licence key. Same scanner, same config, no licence.
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  # The package multi-targets, so this proves both halves compile and that the packed nuspec still
  # satisfies what the Umbraco Marketplace requires to list it.
  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - run: dotnet build src/BaryoDev.Umbraco.ReadAloud -c Release

      - run: dotnet pack src/BaryoDev.Umbraco.ReadAloud -c Release --no-build -o artifacts

      # Neither condition fails a build when broken, and both are invisible until the listing
      # silently does not appear on the marketplace.
      - name: Verify marketplace requirements
        run: |
          cd artifacts
          unzip -p *.nupkg '*.nuspec' > spec.xml
          grep -q 'umbraco-marketplace' spec.xml || { echo "missing umbraco-marketplace tag"; exit 1; }
          grep -q 'id="Umbraco.Cms' spec.xml       || { echo "missing direct Umbraco.Cms dependency"; exit 1; }
          echo "tag and Umbraco.Cms dependency both present"
          echo "--- advertised compatibility ---"
          grep -o 'id="Umbraco.Cms.Api.Management" version="[^"]*"' spec.xml

      # Omitting <Description> is not an error: NuGet substitutes the literal string
      # "Package Description" and packs happily, and that string is then what nuget.org and the
      # marketplace show as the listing's summary. The icon and readme are the same shape of
      # problem, named in the csproj but only actually packed by the None items beside them.
      - name: Listing metadata is real
        run: |
          cd artifacts
          if grep -q '<description>Package Description</description>' spec.xml; then
            echo "description is still NuGet's placeholder"
            exit 1
          fi
          unzip -l *.nupkg | grep -q 'icon.png'  || { echo "icon.png not packed"; exit 1; }
          unzip -l *.nupkg | grep -q 'README.md' || { echo "README.md not packed"; exit 1; }
          echo "description, icon and readme all present"

      - name: Both target frameworks shipped
        run: |
          cd artifacts
          unzip -l *.nupkg | grep -q 'lib/net9.0/'  || { echo "net9.0 missing (Umbraco 16)"; exit 1; }
          unzip -l *.nupkg | grep -q 'lib/net10.0/' || { echo "net10.0 missing (Umbraco 17, 18)"; exit 1; }
          echo "net9.0 and net10.0 both present"

      # The client script is the browser half of the package. It is a static web asset rather than
      # a compiled file, so nothing about the build fails if it stops being packed.
      - name: The client script shipped
        run: |
          cd artifacts
          unzip -l *.nupkg | grep -q 'readaloud.js' || { echo "readaloud.js not packed"; exit 1; }
          echo "readaloud.js present"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # Every supported major, each booting a real Umbraco on SQLite. A version range in the csproj is
  # a claim; this is the evidence for it.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - umbraco: "16.5.1"
            framework: net9.0
            note: "standard-term support"
          - umbraco: "17.6.1"
            framework: net10.0
            note: "current LTS"
          - umbraco: "18.1.0"
            framework: net10.0
            note: "latest"

    name: Umbraco ${{ matrix.umbraco }} (${{ matrix.framework }}, ${{ matrix.note }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # ClientNodeTests shells out to `node --test` to run the browser client's own suite. Without
      # node on PATH that test fails outright in CI by design, so this step is what makes those 25
      # client tests part of the build rather than a hole in it. 22 is the floor because the client
      # tests use node:test, which is only stable from 20 onwards.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No TargetFrameworks override here. Passing it turns the single-targeted test project into
      # a multi-targeting one, and `dotnet test` then silently discovers nothing. The test project
      # already derives its own TargetFramework from UmbracoVersion, and a ProjectReference picks
      # the matching asset out of the multi-targeted package on its own.
      #
      # Category!=Live excludes the one test that calls the real Microsoft endpoint. It is already
      # [Fact(Skip)], so the filter is belt and braces, but it also keeps the trx clean: a skipped
      # test counts toward total and not toward passed, which would break the equality check below.
      - name: Test
        run: >
          dotnet test tests/BaryoDev.Umbraco.ReadAloud.Tests
          -p:UmbracoVersion=${{ matrix.umbraco }}
          --filter "Category!=Live"
          --logger "trx;LogFileName=results.trx"
          --results-directory ${{ github.workspace }}/testresults
          --verbosity normal

      # A run that discovers no tests exits zero. Without this the whole matrix can go green while
      # proving nothing.
      #
      # The floor is 65 against a suite of 80. It is not 80, because pinning it to the exact count
      # turns every deliberate test deletion into a second edit in a second file, and someone who
      # has to edit this number to make CI pass learns to edit it without thinking. It is not 30
      # either: the largest test class here is 14 tests, so 65 is the highest floor that still
      # trips if any single class stops being discovered, which is the failure this guards against.
      # Raise it when the suite grows meaningfully; never lower it to make a run look complete.
      - name: Assert the tests actually ran
        run: |
          TRX=$(find "${{ github.workspace }}/testresults" -name 'results.trx' | head -1)
          test -n "$TRX" || { echo "no trx produced: nothing ran"; exit 1; }
          TOTAL=$(grep -o 'total="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*')
          PASSED=$(grep -o 'passed="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*')
          echo "total=$TOTAL passed=$PASSED"
          test "${TOTAL:-0}" -ge 65 || { echo "expected at least 65 tests, got ${TOTAL:-0}"; exit 1; }
          test "$TOTAL" = "$PASSED" || { echo "not every test passed"; exit 1; }

      - name: Verify the framework under test
        run: |
          test -d tests/BaryoDev.Umbraco.ReadAloud.Tests/bin/Debug/${{ matrix.framework }} \
            || { echo "expected ${{ matrix.framework }} output for Umbraco ${{ matrix.umbraco }}"; exit 1; }
          echo "ran on ${{ matrix.framework }} as intended"

      # Kept on failure and on success alike. The counts above say how many tests ran; the trx says
      # which ones, which is the difference between "the matrix is green" and being able to show
      # that a particular test ran on Linux.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-umbraco-${{ matrix.umbraco }}
          path: ${{ github.workspace }}/testresults/results.trx
