name: Claude probe

# Throwaway. Delete the branch when done.
on:
  push:
    branches: [ci/claude-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 5296bb708cb513b8ddf21a8cffdbbfd6f6ee8732
          persist-credentials: false
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.316
      - name: Claude Code in the PR checkout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ~/.local/bin/claude -p "Say ok" --model claude-sonnet-5-5 --max-turns 1 --output-format json --allowedTools "Bash(gh pr view:*)" > out.json || echo "exit $?"
          jq -c '{is_error, subtype, result, total_cost_usd}' out.json
