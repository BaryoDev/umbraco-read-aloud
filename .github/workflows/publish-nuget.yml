name: Publish to NuGet

# Version comes from <Version> in the package csproj, never from a hand-typed input, so the
# published version is always recorded in git and the tag has to agree with it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack without publishing"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token nuget.org exchanges for a short-lived API key. No
      # long-lived secret is stored in this repository.
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # Both, because the package multi-targets: Umbraco 16 is .NET 9, 17 and 18 are .NET 10.
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Read version from source
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/BaryoDev.Umbraco.ReadAloud/BaryoDev.Umbraco.ReadAloud.csproj)
          test -n "$VERSION" || { echo "::error::No <Version> found in the csproj"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from the csproj: $VERSION"

          # The Azure package ships with the core at the same version. A mismatch would publish a
          # package whose version the tag does not name.
          AZURE=$(grep -oP '(?<=<Version>)[^<]+' src/BaryoDev.Umbraco.ReadAloud.Azure/BaryoDev.Umbraco.ReadAloud.Azure.csproj)
          test -n "$AZURE" || { echo "::error::No <Version> found in the Azure csproj"; exit 1; }
          if [ "$AZURE" != "$VERSION" ]; then
            echo "::error::Azure <Version> $AZURE does not match the core <Version> $VERSION" && exit 1
          fi

      - name: Confirm tag matches the version in source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match <Version> $VERSION" && exit 1
          fi

      - name: Refuse to republish a version that already exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # nuget.org accepts a version once, forever. --skip-duplicate below turns a repeat into a
          # silent success, which is the wrong answer when the intent was to ship something new:
          # the run goes green and the change is not out there. Fail loudly instead, before any of
          # the work, so the fix is an obvious version bump.
          #
          # Both packages are checked, and the run stops only when both already have this version.
          # If the core went out and the Azure push failed, a rerun of the same tag has to reach the
          # push step, where --skip-duplicate passes over the core and publishes the Azure package.
          #
          # Fails closed. An earlier version of this swallowed transport errors and treated the
          # empty result as "not published", so the one situation the check exists for, being
          # unsure, was the situation it waved through. Only a 404 counts as not published; a 200
          # is parsed and compared, and anything else stops the run.
          #
          # Compared the way NuGet normalizes versions, so 0.1.0, 0.1.0.0 and 0.1.0+build are one
          # version and a repeat cannot slip through on formatting alone. Build metadata after a +
          # is dropped, case is folded, and a fourth component is trimmed when it is zero. Done with
          # jq and shell rather than an inline script with its own indentation, because a
          # multi-line program inside a YAML block scalar breaks the scalar.
          NORM=$(printf '%s' "$VERSION" | tr 'A-Z' 'a-z' | cut -d'+' -f1)
          case "$NORM" in *.*.*.0) NORM=${NORM%.0} ;; esac

          PUBLISHED=0
          for ID in baryodev.umbraco.readaloud baryodev.umbraco.readaloud.azure; do
            URL="https://api.nuget.org/v3-flatcontainer/$ID/index.json"
            STATUS=$(curl -sS --max-time 30 -o /tmp/versions.json -w '%{http_code}' "$URL") || {
              echo "::error::Could not reach nuget.org to check $ID for an existing $VERSION." && exit 1
            }

            case "$STATUS" in
              404)
                echo "$ID has never been published, so $VERSION is free."
                ;;
              200)
                if jq -e --arg v "$NORM" \
                     '(.versions // []) | map(ascii_downcase | split("+")[0]) | index($v)' \
                     /tmp/versions.json > /dev/null; then
                  echo "$ID already has $VERSION."
                  PUBLISHED=$((PUBLISHED + 1))
                else
                  echo "$ID does not have $VERSION ($NORM) yet."
                fi
                ;;
              *)
                echo "::error::nuget.org answered $STATUS when asked about $ID." && exit 1
                ;;
            esac
          done

          if [ "$PUBLISHED" -eq 2 ]; then
            echo "::error::$VERSION is already on nuget.org. Bump <Version> in the csproj." && exit 1
          fi

      - run: dotnet restore src/BaryoDev.Umbraco.ReadAloud/BaryoDev.Umbraco.ReadAloud.csproj

      - run: dotnet build src/BaryoDev.Umbraco.ReadAloud/BaryoDev.Umbraco.ReadAloud.csproj --configuration Release --no-restore

      # A package must never ship without its tests having run.
      - name: Test the package
        run: dotnet test tests/BaryoDev.Umbraco.ReadAloud.Tests --configuration Release --verbosity normal

      # The client is shipped content, not a build artifact of the site: readaloud.js goes into the
      # .nupkg as a static web asset. Its tests are Node's, so dotnet test cannot see them, and
      # without this step a broken client would publish with every check green.
      - name: Test the client
        working-directory: tests/client
        run: node --test

      - name: Pack
        run: dotnet pack src/BaryoDev.Umbraco.ReadAloud/BaryoDev.Umbraco.ReadAloud.csproj --configuration Release --no-build --output ./nupkgs

      # The Azure package is published with the core, at the same version, and pushed after it
      # (the Publish step names both files in order). Its tests are in the test project above.
      - name: Pack the Azure package
        run: |
          dotnet build src/BaryoDev.Umbraco.ReadAloud.Azure/BaryoDev.Umbraco.ReadAloud.Azure.csproj --configuration Release
          dotnet pack src/BaryoDev.Umbraco.ReadAloud.Azure/BaryoDev.Umbraco.ReadAloud.Azure.csproj --configuration Release --no-build --output ./nupkgs

      - name: Confirm the packed client is the file that was tested
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Static web assets travel through a build pipeline, so "the tests passed" and "the tested
          # file is what shipped" are separate claims. Compare the bytes rather than assume.
          mkdir -p /tmp/packed
          unzip -o -q "./nupkgs/BaryoDev.Umbraco.ReadAloud.$VERSION.nupkg" -d /tmp/packed
          PACKED=/tmp/packed/staticwebassets/readaloud.js
          SOURCE=src/BaryoDev.Umbraco.ReadAloud/wwwroot/readaloud.js
          test -f "$PACKED" || { echo "::error::readaloud.js is missing from the package"; exit 1; }
          if ! cmp -s "$PACKED" "$SOURCE"; then
            echo "::error::The packed readaloud.js differs from the source the tests ran against."
            diff <(head -40 "$SOURCE") <(head -40 "$PACKED") || true
            exit 1
          fi
          echo "Packed client matches source ($(wc -c < "$SOURCE") bytes)."

          # The dashboard and its manifest ship the same way, and nothing else in the run opens
          # them. The manifest's dashboard entry has to point at a file that is in the package.
          for f in dashboard.js umbraco-package.json; do
            test -f "/tmp/packed/staticwebassets/$f" || { echo "::error::$f is missing from the package"; exit 1; }
            cmp -s "/tmp/packed/staticwebassets/$f" "src/BaryoDev.Umbraco.ReadAloud/wwwroot/$f" || {
              echo "::error::The packed $f differs from the source."; exit 1
            }
          done
          python3 - <<'PY'
          import json, os, sys

          root = "/tmp/packed/staticwebassets"
          prefix = "/App_Plugins/BaryoDev.ReadAloud/"
          elements = [
              e.get("element", "")
              for e in json.load(open(root + "/umbraco-package.json")).get("extensions", [])
              if e.get("type") == "dashboard"
          ]
          if not elements:
              print("::error::umbraco-package.json declares no dashboard.")
              sys.exit(1)
          for element in elements:
              if not element.startswith(prefix) or not os.path.isfile(root + "/" + element[len(prefix):]):
                  print(f"::error::The dashboard element {element!r} is not a file in the package.")
                  sys.exit(1)
          print("Dashboard entry resolves to a packed file.")
          PY

      - name: List artifacts
        run: ls -la ./nupkgs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkgs
          path: ./nupkgs/*

      # ---------------------------------------------------------------------------------------
      # Everything above proves the source is correct. Nothing above proves the PACKAGE is, and
      # they are different claims.
      #
      # Every test in this repo consumes the library through a
      # ProjectReference. A PackageReference resolves differently in exactly the places this
      # package lives: static web assets travel through different plumbing, any .props or .targets
      # in the package only apply when consumed as a package, and per-framework dependency groups
      # are a package concept that does not exist for a project reference.
      #
      # So a package could pack cleanly, pass every test, and still fail to work for the first
      # person who installs it. The install steps below close that.
      # ---------------------------------------------------------------------------------------

      - name: Install the package into a scratch site, as a consumer would
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FEED="$PWD/nupkgs"
          WORK=$(mktemp -d)
          cd "$WORK"

          dotnet new web -o consumer --framework net10.0 >/dev/null
          cd consumer

          # A local feed only. Restoring from nuget.org here would silently resolve a previously
          # published version and prove nothing about the bytes this run just built.
          cat > nuget.config <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$FEED" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML

          dotnet add package BaryoDev.Umbraco.ReadAloud --version "$VERSION" --source "$FEED"
          dotnet add package BaryoDev.Umbraco.ReadAloud.Azure --version "$VERSION" --source "$FEED"
          dotnet build --configuration Release

          # The client is a static web asset, and asserting on bin/ would be wrong: .NET does not
          # copy these at build time, it records them in a manifest and serves them from the
          # package at runtime. The manifest is therefore the thing to check, and it has to carry
          # both the file and the base path the site will serve it from. If either is missing the
          # package installs cleanly and the browser has nothing to load.
          MANIFEST=$(find obj -name 'staticwebassets.build.json' | head -1)
          test -n "$MANIFEST" || {
            echo "::error::No static web assets manifest. The package contributed no client assets at all." && exit 1
          }

          # Parsed, not grepped. Two greps for the file and the path can match two different asset
          # records, so a manifest with readaloud.js at the wrong path and some other asset at the
          # right one would pass. This requires ONE record carrying both.
          #
          # The base path is pinned exactly rather than merely being present: it is the string a
          # site owner writes in their template and the one the live site serves from, so a silent
          # change breaks every existing installation's markup while all the tests stay green.
          python3 - "$MANIFEST" <<'PY'
          import json, sys

          assets = json.load(open(sys.argv[1])).get("Assets", [])
          want_base = "App_Plugins/BaryoDev.ReadAloud"
          failed = False

          for want_file in ("readaloud.js", "dashboard.js", "umbraco-package.json"):
              matches = [
                  a for a in assets
                  if a.get("RelativePath", "").rsplit("/", 1)[-1] == want_file
                  and a.get("BasePath", "").strip("/") == want_base
              ]

              if len(matches) == 1:
                  print(f"Consumer resolves {want_base}/{want_file}")
                  continue

              failed = True
              print(f"::error::Expected exactly one asset record for {want_file} at {want_base}, found {len(matches)}.")
              for a in assets:
                  if want_file in a.get("RelativePath", ""):
                      print(f"  RelativePath={a.get('RelativePath')!r} BasePath={a.get('BasePath')!r}")

          sys.exit(1 if failed else 0)
          PY

      # Requested here rather than earlier because the key expires after an hour and each OIDC
      # token buys exactly one key. Runs on dry runs too, so a dry run actually verifies the
      # trusted publishing policy. Obtaining a key publishes nothing.
      - name: Exchange OIDC token for a short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER || 'arnelirobles' }}

      - name: Confirm the key was issued
        env:
          # Through the environment rather than interpolated into the script. An expression is
          # substituted into the shell source before the shell parses it, so a value containing
          # shell syntax would be executed rather than compared, and it can surface in a trace.
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::No API key returned. Check the trusted publishing policy on nuget.org." && exit 1
          fi
          echo "Trusted publishing OK: short-lived key issued."

      # Publication requires a tag push, and only a tag push. A manual run cannot reach this step
      # whatever its inputs say, because the tag is what proves the version was reviewed: the
      # "Confirm tag matches" step above is itself conditional on a tag ref, so a dispatched run
      # with dry_run unticked would have published an unvalidated branch with the tag check
      # skipped rather than passed. workflow_dispatch stays useful for exercising the pipeline,
      # which it does all the way through the OIDC exchange.
      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          # Core first, then Azure, named rather than globbed so the order does not depend on
          # how the shell sorts file names. The Azure package depends on the core.
          for PKG in "BaryoDev.Umbraco.ReadAloud.$VERSION.nupkg" "BaryoDev.Umbraco.ReadAloud.Azure.$VERSION.nupkg"; do
            test -f "./nupkgs/$PKG" || { echo "::error::$PKG was not packed"; exit 1; }
            dotnet nuget push "./nupkgs/$PKG" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
